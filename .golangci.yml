version: "2"

run:
  timeout: 5m

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - revive
    - gosec
    - unused
    - ineffassign
    - misspell
    - gocritic
    - bodyclose
    - noctx

  settings:
    revive:
      rules:
        - name: exported
        - name: blank-imports
    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - gosec
        - errcheck
  max-issues-per-linter: 0
  max-same-issues: 0
