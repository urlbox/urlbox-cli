name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.11.4

      - name: Check formatting
        run: |
          go install mvdan.cc/gofumpt@v0.9.2
          make fmt-check

      - name: Run tests
        run: make test

      - name: Build
        run: make build

      - name: Surface compatibility check
        run: make surface-check
