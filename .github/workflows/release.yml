name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - uses: sigstore/cosign-installer@v3

      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.11.4

      - name: Install gofumpt
        run: go install mvdan.cc/gofumpt@v0.9.2

      - name: Generate Homebrew tap token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.DEVOPS_APP_ID }}
          private-key: ${{ secrets.DEVOPS_APP_PRIVATE_KEY }}
          owner: urlbox
          repositories: homebrew-tap

      - uses: goreleaser/goreleaser-action@v6
        with:
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ steps.app-token.outputs.token }}

  smoke:
    needs: release
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            asset: urlbox_*_linux_amd64.tar.gz
            extract: tar xzf
          - os: macos-latest
            asset: urlbox_*_darwin_arm64.tar.gz
            extract: tar xzf
          - os: windows-latest
            asset: urlbox_*_windows_amd64.zip
            extract: unzip -o
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - name: Download binary
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ASSET=$(echo "${{ matrix.asset }}" | sed "s/\\*/$VERSION/")
          gh release download "$GITHUB_REF_NAME" --repo urlbox/urlbox-cli --pattern "$ASSET"
          ${{ matrix.extract }} "$ASSET"

      - name: Verify binary runs
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          OUTPUT=$(./urlbox --version 2>&1 || ./urlbox.exe --version 2>&1)
          echo "$OUTPUT"
          echo "$OUTPUT" | grep -q "$VERSION"

  npm:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Set version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cd npm && npm version "$VERSION" --no-git-tag-version

      - name: Publish to npm
        run: cd npm && npm publish --access public --provenance
