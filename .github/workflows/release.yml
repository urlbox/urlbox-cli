name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - uses: sigstore/cosign-installer@v3

      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.11.4

      - name: Install gofumpt
        run: go install mvdan.cc/gofumpt@v0.9.2

      - name: Generate Homebrew tap token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.DEVOPS_APP_ID }}
          private-key: ${{ secrets.DEVOPS_APP_PRIVATE_KEY }}
          owner: urlbox
          repositories: homebrew-tap

      - uses: goreleaser/goreleaser-action@v6
        with:
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ steps.app-token.outputs.token }}

  smoke:
    needs: release
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            asset: urlbox_*_linux_amd64.tar.gz
            extract: tar xzf
          - os: macos-latest
            asset: urlbox_*_darwin_arm64.tar.gz
            extract: tar xzf
          - os: windows-latest
            asset: urlbox_*_windows_amd64.zip
            extract: unzip -o
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - name: Download binary
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ASSET=$(echo "${{ matrix.asset }}" | sed "s/\\*/$VERSION/")
          gh release download "$GITHUB_REF_NAME" --repo urlbox/urlbox-cli --pattern "$ASSET"
          ${{ matrix.extract }} "$ASSET"

      - name: Verify binary runs
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          OUTPUT=$(./urlbox --version 2>&1 || ./urlbox.exe --version 2>&1)
          echo "$OUTPUT"
          echo "$OUTPUT" | grep -q "$VERSION"

  verify-checksums:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: sigstore/cosign-installer@v3

      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "$GITHUB_REF_NAME" --repo urlbox/urlbox-cli

      - name: Verify checksums
        run: sha256sum --check checksums.txt

      - name: Verify cosign signature
        run: |
          cosign verify-blob checksums.txt --bundle checksums.txt.sigstore.json --certificate-identity-regexp='github.com/urlbox/urlbox-cli' --certificate-oidc-issuer='https://token.actions.githubusercontent.com'

  test-npm-install:
    needs: npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install via npm
        run: npm install -g @urlbox/cli

      - name: Verify binary
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          OUTPUT=$(urlbox --version 2>&1)
          echo "$OUTPUT"
          echo "$OUTPUT" | grep -q "$VERSION"

  test-brew-install:
    needs: release
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - name: Install via Homebrew
        run: brew install urlbox/tap/urlbox

      - name: Verify binary
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          OUTPUT=$(urlbox --version 2>&1)
          echo "$OUTPUT"
          echo "$OUTPUT" | grep -q "$VERSION"

      - name: Verify upgrade detection
        run: |
          urlbox upgrade 2>&1 | grep -q "Install method"

  test-install-script:
    needs: release
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Run install script
        run: |
          sudo mkdir -p /usr/local/bin
          bash scripts/install.sh

      - name: Verify binary
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          OUTPUT=$(urlbox --version 2>&1)
          echo "$OUTPUT"
          echo "$OUTPUT" | grep -q "$VERSION"

  npm:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Set version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cd npm && npm version "$VERSION" --no-git-tag-version

      - name: Publish to npm
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cd npm
          npm publish --access public --provenance 2>&1 || {
            if npm view "@urlbox/cli@$VERSION" version >/dev/null 2>&1; then
              echo "Version $VERSION already published — skipping"
            else
              exit 1
            fi
          }
