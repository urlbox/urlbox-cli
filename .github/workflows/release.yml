name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - uses: sigstore/cosign-installer@v3

      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.11.4

      - name: Install gofumpt
        run: go install mvdan.cc/gofumpt@v0.9.2

      - name: Generate Homebrew tap token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.DEVOPS_APP_ID }}
          private-key: ${{ secrets.DEVOPS_APP_PRIVATE_KEY }}
          owner: urlbox
          repositories: homebrew-tap

      - uses: goreleaser/goreleaser-action@v6
        with:
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ steps.app-token.outputs.token }}

  npm:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Install npm 11
        run: npm install -g npm@11.13.0

      - name: Set version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cd npm && npm version "$VERSION" --no-git-tag-version

      - name: Publish to npm
        run: cd npm && npm publish --access public --provenance
